[project]
name = "config-to-vault"
version = "0.1.0"
description = "Replicate a folder of config files from git into HashiCorp Vault KV v2."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["vault", "hashicorp-vault", "spring-boot", "config", "gitops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.scripts]
config-to-vault = "config_to_vault.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_to_vault"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
